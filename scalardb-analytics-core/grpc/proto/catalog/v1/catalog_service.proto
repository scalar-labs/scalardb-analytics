syntax = "proto3";

package catalog.v1;

import "catalog/v1/catalog.proto";
import "datasource/v1/data_source_service.proto";

message CreateCatalogRequest {
  string catalog_name = 1;
}

message CreateCatalogResponse {
  Catalog catalog = 1;
}

message FindCatalogRequest {
  string catalog_name = 1;
}

message FindCatalogResponse {
  optional Catalog catalog = 1;
}

message ListAllCatalogsRequest {}

message ListAllCatalogsResponse {
  repeated Catalog catalogs = 1;
}

message InitializeCatalogRequest {
  string catalog_name = 1;
  repeated datasource.v1.RegisterRequest data_sources = 2;
}

message InitializeCatalogResponse {
  optional Catalog catalog = 1;
}

message FindCatalogByIdRequest {
  string catalog_id = 1;
}

message FindCatalogByIdResponse {
  optional Catalog catalog = 1;
}

message DeleteCatalogRequest {
  string catalog_name = 1;
  bool cascade = 2;
}

message DeleteCatalogResponse {
  bool deleted = 1;
}

message DeleteCatalogByIdRequest {
  string catalog_id = 1;
  bool cascade = 2;
}

message DeleteCatalogByIdResponse {
  bool deleted = 1;
}

service CatalogService {
  // CreateCatalog creates a new catalog.
  rpc CreateCatalog(CreateCatalogRequest) returns (CreateCatalogResponse) {}

  // FindCatalog returns a catalog by name.
  rpc FindCatalog(FindCatalogRequest) returns (FindCatalogResponse) {}

  // ListAllCatalogs returns a list of all catalogs.
  rpc ListAllCatalogs(ListAllCatalogsRequest) returns (ListAllCatalogsResponse) {}

  // InitializeCatalog initializes a catalog with the given data sources.
  // If the catalog already exists, it returns an empty Optional.
  rpc InitializeCatalog(InitializeCatalogRequest) returns (InitializeCatalogResponse) {}

  // FindCatalogById returns a catalog by ID.
  rpc FindCatalogById(FindCatalogByIdRequest) returns (FindCatalogByIdResponse) {}

  // DeleteCatalog deletes a catalog by name.
  rpc DeleteCatalog(DeleteCatalogRequest) returns (DeleteCatalogResponse) {}

  // DeleteCatalogById deletes a catalog by ID.
  rpc DeleteCatalogById(DeleteCatalogByIdRequest) returns (DeleteCatalogByIdResponse) {}
}
