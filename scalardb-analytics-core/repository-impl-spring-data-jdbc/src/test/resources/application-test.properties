# Test configuration with embedded H2 database
scalar.db.analytics.server.db.contact-points=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
scalar.db.analytics.server.db.username=sa
scalar.db.analytics.server.db.password=

# Enable SQL logging for debugging
logging.level.org.springframework.jdbc.core=DEBUG
# Reduce noisy logs from migration executor
logging.level.com.scalar.db.analytics.repository.impl.spring.migration=DEBUG
logging.level.com.scalar.db.analytics.repository.impl.spring=INFO

# JPA/JDBC configuration
spring.data.jdbc.repositories.enabled=true
