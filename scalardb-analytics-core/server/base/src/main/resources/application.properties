# Default configuration for ScalarDB Analytics Server

# gRPC server configuration
# scalar.db.analytics.server.catalog.port=11051  # default: 11051

# gRPC TLS configuration
# scalar.db.analytics.server.tls.enabled=true  # default: false
# scalar.db.analytics.server.tls.cert-chain-path=/path/to/cert-chain.pem
# scalar.db.analytics.server.tls.private-key-path=/path/to/private-key.pem

# Graceful shutdown configuration (internal)
# 10 seconds delay for health check propagation
scalar.db.analytics.server.graceful-shutdown-delay-millis=10000

# Server database configuration
# scalar.db.analytics.server.db.contact-points=jdbc:postgresql://localhost:5432/scalardb_analytics
# scalar.db.analytics.server.db.username=your_username
# scalar.db.analytics.server.db.password=your_password

# Server database connection pool configuration
scalar.db.analytics.server.db.pool.size=10
scalar.db.analytics.server.db.pool.max-lifetime=1800000
scalar.db.analytics.server.db.pool.connection-timeout=30000
scalar.db.analytics.server.db.pool.minimum-idle=5
scalar.db.analytics.server.db.pool.idle-timeout=600000

# Spring Boot configuration
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=false
logging.level.root=INFO
logging.level.com.scalar.db.analytics=INFO
# SchemaLoader emits WARN when coordinator tables already exist; suppress it to avoid confusing users.
logging.level.com.scalar.db.schemaloader=ERROR

# Suppress noisy gRPC debug logs (these are expected on non-Linux systems)
logging.level.io.grpc=WARN
logging.level.io.grpc.netty=WARN
logging.level.io.grpc.internal=WARN
logging.level.io.grpc.ServerRegistry=ERROR
