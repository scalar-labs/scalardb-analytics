pre-commit:
  parallel: false
  commands:
    remove-trailing-spaces:
      run: perl -i -pe 's/[ \t]+$//' {staged_files}
      glob:
        - "*.properties"
        - "*.xml"
        - "*.yml"
        - "*.yaml"
        - "*.json"
        - "*.md"
        - "*.txt"
        - "*.proto"
        - "*.factories"
        - "**/Makefile"
        - "*.gitignore"
        - "*.conf"
        - "*.scala"
        - "*.sc"
      stage_fixed: true
      priority: 1
    ensure-newline-eof:
      run: perl -i -pe 'chomp if eof; $_ .= "\n" if eof' {staged_files}
      glob:
        - "*.properties"
        - "*.xml"
        - "*.yml"
        - "*.yaml"
        - "*.json"
        - "*.md"
        - "*.txt"
        - "*.proto"
        - "*.factories"
        - "**/Makefile"
        - "*.gitignore"
        - "*.conf"
        - "*.scala"
        - "*.sc"
      stage_fixed: true
      priority: 2
    spotless:
      run: ./gradlew spotlessApply
      glob: "*.{java,kts}"
      stage_fixed: true
      priority: 3
