name: Publish release artifacts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  GPR_USERNAME: ${{ github.repository_owner }}
  GPR_PASSWORD: ${{ secrets.CR_PAT }}

jobs:
  release-to-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

        # The Mill build resolves the Gradle modules as coordinates, so they have to exist in this
        # runner's Maven Local before it runs. They are not published to Maven Central themselves.
      - name: Publish Gradle modules to Maven Local
        working-directory: scalardb-analytics-core
        run: ./gradlew publishToMavenLocal

      - name: Publish scalardb-analytics-spark-all to Maven Central
        working-directory: scalardb-analytics-spark
        env:
          JAVA_OPTS: "-Xmx4g"
          MILL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          PGP_SECRET_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_SECRET_KEY }}
        run: |
          export MILL_PGP_SECRET_BASE64=$(printf '%s' "$PGP_SECRET_KEY" | base64 -w0)
          ./mill --jobs 1 sparkAll.__.publishSonatypeCentral

  release-to-ghcr:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CLI Docker image
        working-directory: scalardb-analytics-core/docker/cli
        run: make release

      - name: Build and push Server Docker image
        working-directory: scalardb-analytics-core/docker/server
        run: make release

  create-github-release:
    name: Create GitHub Release
    needs: [release-to-maven-central, release-to-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is like "v3.18.0"; the JAR name uses the non-v-prefixed form.
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate error code documentation
        working-directory: scalardb-analytics-core
        run: ./gradlew :tools:error-code-doc-generator:run --args="${GITHUB_WORKSPACE}/scalardb-analytics-status-codes.mdx"

      - name: Build CLI shadow JAR
        working-directory: scalardb-analytics-core
        run: ./gradlew :client:cli:shadowJar

      - name: Extract changelog for version
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          start=$(grep -nF "## [${version}]" CHANGELOG.md | head -1 | cut -d: -f1 || true)
          # Without this guard an absent heading leaves `start` empty, arithmetic reads it as 0,
          # and the extraction returns the top of the file — release notes for the wrong version,
          # non-empty enough to pass the check below.
          if [ -z "$start" ]; then
            echo "Error: CHANGELOG.md has no '## [${version}]' heading" >&2
            exit 1
          fi
          end=$(tail -n +"$((start + 1))" CHANGELOG.md | grep -nF "## [" | head -1 | cut -d: -f1 || true)
          if [ -n "$end" ]; then
            tail -n +"$((start + 1))" CHANGELOG.md | head -n "$((end - 1))" > release_notes.txt
          else
            tail -n +"$((start + 1))" CHANGELOG.md > release_notes.txt
          fi

      - name: Verify the changelog entry is not empty
        run: |
          # Not `[ -s ]`: a section holding only the blank line before the next heading is one
          # byte long, which that test reports as non-empty.
          if ! grep -q '[^[:space:]]' release_notes.txt; then
            echo "Error: the '## [${{ steps.version.outputs.version }}]' section of CHANGELOG.md is empty" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "GitHub release '$version' already exists, updating notes and title."
            gh release edit "$version" --title "$version" --notes-file release_notes.txt
          else
            echo "GitHub release '$version' does not exist, creating it."
            gh release create "$version" --title "$version" --notes-file release_notes.txt
          fi

      - name: Upload the CLI JAR and the error code documentation to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          number="${{ steps.version.outputs.number }}"
          jar_path="scalardb-analytics-core/client/cli/build/libs/scalardb-analytics-cli-${number}-all.jar"
          if [ ! -f "$jar_path" ]; then
            echo "Error: built JAR not found at $jar_path" >&2
            exit 1
          fi
          gh release upload "$version" "$jar_path" scalardb-analytics-status-codes.mdx --clobber
