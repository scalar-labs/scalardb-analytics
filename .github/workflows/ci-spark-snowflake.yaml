name: CI for ScalarDB Analytics Spark (Snowflake)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC

env:
  GPR_USERNAME: ${{ github.repository_owner }}
  GPR_PASSWORD: ${{ secrets.CR_PAT }}
  ANALYTICS_INT_TEST_ENV: CI
  ANALYTICS_INT_TEST_ENV_SNOWFLAKE_ACCOUNT: ${{secrets.SCALAR_DB_ANALYTICS_CI_SNOWFLAKE_ACCOUNT}}
  ANALYTICS_INT_TEST_ENV_SNOWFLAKE_USERNAME: ${{secrets.SCALAR_DB_ANALYTICS_CI_SNOWFLAKE_USERNAME}}
  ANALYTICS_INT_TEST_ENV_SNOWFLAKE_PASSWORD: ${{secrets.SCALAR_DB_ANALYTICS_CI_SNOWFLAKE_PASSWORD}}

jobs:
  # Ideally, we would upload Gradle artifacts only when Gradle files change (via ci.yaml)
  # and reuse them here. However, GitHub Actions doesn't provide a straightforward way
  # to download artifacts from a different workflow run without knowing the run-id or
  # using third-party actions. As a workaround, we publish Gradle modules in every run.
  build-gradle-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Gradle modules to Maven Local
        working-directory: scalardb-analytics-core
        run: ./gradlew publishToMavenLocal

      - name: Upload Maven Local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/scalardb-analytics*
          retention-days: 1

  test:
    needs: build-gradle-dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala-version: ['2.12', '2.13']
        spark-version: ['3.4', '3.5']

    steps:
      # Database names cannot contain dots (.) as they conflict with SQL identifier separators.
      # GitHub Actions expressions don't have a replace function, so we use shell substitution.
      - name: Set database suffix
        run: |
          SCALA_VERSION=$(echo "${{ matrix.scala-version }}" | tr '.' '_')
          SPARK_VERSION=$(echo "${{ matrix.spark-version }}" | tr '.' '_')
          echo "ANALYTICS_INT_TEST_ENV_SNOWFLAKE_DATABASE_SUFFIX=${{ github.run_id }}_${{ github.run_attempt }}_${SCALA_VERSION}_${SPARK_VERSION}" >> $GITHUB_ENV

      - name: Verify Snowflake credentials are not expired
        run: |
          # Install Snowflake CLI
          pipx install snowflake-cli

          # Configure Snowflake CLI credentials with PAT
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          default_connection_name = "default"
          [connections.default]
          account = "${{secrets.SCALAR_DB_ANALYTICS_CI_SNOWFLAKE_ACCOUNT}}"
          user = "${{secrets.SCALAR_DB_ANALYTICS_CI_SNOWFLAKE_USERNAME}}"
          password = "${{secrets.SCALAR_DB_ANALYTICS_CI_SNOWFLAKE_PASSWORD}}"
          EOF
          chmod 0600 ~/.snowflake/config.toml

          echo "Verifying Snowflake credentials..."
          snow sql -q "SHOW DATABASES;" || (echo "Failed to authenticate with Snowflake, credentials may be expired. To renew the credentials, refer to https://github.com/scalar-labs/scalardb-analytics/blob/main/.github/workflows/README.mdx#renew-databricks-and-snowflake-credentials-once-expired " && exit 1)
          echo "Snowflake credentials are valid."

      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download Gradle modules
        uses: actions/download-artifact@v8
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/

      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('scalardb-analytics-spark/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Run Snowflake integration tests
        working-directory: scalardb-analytics-spark
        run: |
          ./mill 'ciTest[${{ matrix.scala-version }},${{ matrix.spark-version }}].integrationTestSnowflake'

      - name: Collect Mill test reports
        if: always()
        working-directory: scalardb-analytics-spark
        run: ./mill collectTestReports

      - name: Upload Mill test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-spark-snowflake-test-reports-${{ matrix.scala-version }}-${{ matrix.spark-version }}
          path: scalardb-analytics-spark/out/collectTestReports.dest/${{ matrix.scala-version }}-${{ matrix.spark-version }}/
