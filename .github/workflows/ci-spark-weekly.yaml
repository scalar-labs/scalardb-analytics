name: Weekly CI for ScalarDB Analytics Spark (All DB Versions)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC

env:
  GPR_USERNAME: ${{ github.repository_owner }}
  GPR_PASSWORD: ${{ secrets.CR_PAT }}

jobs:
  # Ideally, we would upload Gradle artifacts only when Gradle files change (via ci.yaml)
  # and reuse them here. However, GitHub Actions doesn't provide a straightforward way
  # to download artifacts from a different workflow run without knowing the run-id or
  # using third-party actions. As a workaround, we publish Gradle modules in every run.
  build-gradle-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Gradle modules to Maven Local
        working-directory: scalardb-analytics-core
        run: ./gradlew publishToMavenLocal

      - name: Upload Maven Local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/scalardb-analytics*
          retention-days: 1

  # Testcontainers would otherwise pull the released `latest` image and test this branch's
  # connector against an old server. Build the server from this branch once and hand it to every
  # test job, as ci-spark.yaml does.
  build-server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server Docker image
        working-directory: scalardb-analytics-core/docker/server
        env:
          DOCKER_BUILDKIT: 1
        run: make build

      - name: Tag server Docker image with commit SHA
        run: |
          docker tag ghcr.io/scalar-labs/scalardb-analytics-server:latest \
            ghcr.io/scalar-labs/scalardb-analytics-server:${{ github.sha }}

      - name: Save Docker image as artifact
        run: |
          docker save ghcr.io/scalar-labs/scalardb-analytics-server:${{ github.sha }} \
            -o /tmp/server-image.tar

      - name: Upload server image artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-docker-image
          path: /tmp/server-image.tar
          retention-days: 1

  integration-test:
    needs: [build-gradle-dependencies, build-server-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala-version: ["2.12", "2.13"]
        spark-version: ["3.5", "4.0", "4.1"]
        # Spark 4 is published for Scala 2.13 only.
        exclude:
          - scala-version: "2.12"
            spark-version: "4.0"
          - scala-version: "2.12"
            spark-version: "4.1"

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Download Gradle modules
        uses: actions/download-artifact@v8
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/

      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('scalardb-analytics-spark/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Download server Docker image
        uses: actions/download-artifact@v8
        with:
          name: server-docker-image
          path: /tmp

      - name: Load server Docker image
        run: docker load -i /tmp/server-image.tar && rm -f /tmp/server-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Run integration tests (all DB versions, Oracle excluded)
        working-directory: scalardb-analytics-spark
        env:
          SCALARDB_ANALYTICS_SERVER_IMAGE: ghcr.io/scalar-labs/scalardb-analytics-server:${{ github.sha }}
        run: |
          ./mill --jobs 2 'ciTest[${{ matrix.scala-version }},${{ matrix.spark-version }}].integrationTestAll'

      - name: Collect Mill test reports
        if: always()
        working-directory: scalardb-analytics-spark
        run: ./mill collectTestReports

      - name: Upload Mill test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-spark-weekly-test-reports-${{ matrix.scala-version }}-${{ matrix.spark-version }}
          path: scalardb-analytics-spark/out/collectTestReports.dest/${{ matrix.scala-version }}-${{ matrix.spark-version }}/

  # Oracle tests run in separate jobs to avoid disk space issues.
  # Oracle Docker images are several GB each. Running them with --jobs 2 alongside
  # other database tests causes disk space exhaustion. By using separate jobs,
  # each Oracle version gets a fresh runner with full disk space available.
  # We test all Oracle versions (19c, 21c, 23c) in weekly CI for comprehensive coverage.
  integration-test-oracle-23:
    needs: [build-gradle-dependencies, build-server-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala-version: ["2.12", "2.13"]
        spark-version: ["3.5", "4.0", "4.1"]
        # Spark 4 is published for Scala 2.13 only.
        exclude:
          - scala-version: "2.12"
            spark-version: "4.0"
          - scala-version: "2.12"
            spark-version: "4.1"

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Download Gradle modules
        uses: actions/download-artifact@v8
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/

      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('scalardb-analytics-spark/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Download server Docker image
        uses: actions/download-artifact@v8
        with:
          name: server-docker-image
          path: /tmp

      - name: Load server Docker image
        run: docker load -i /tmp/server-image.tar && rm -f /tmp/server-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Run Oracle 23c integration tests
        working-directory: scalardb-analytics-spark
        env:
          SCALARDB_ANALYTICS_SERVER_IMAGE: ghcr.io/scalar-labs/scalardb-analytics-server:${{ github.sha }}
        run: |
          ./mill 'ciTest[${{ matrix.scala-version }},${{ matrix.spark-version }}].integrationTestOracle23'

      - name: Collect Mill test reports
        if: always()
        working-directory: scalardb-analytics-spark
        run: ./mill collectTestReports

      - name: Upload Mill test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-spark-oracle-23-test-reports-${{ matrix.scala-version }}-${{ matrix.spark-version }}
          path: scalardb-analytics-spark/out/collectTestReports.dest/${{ matrix.scala-version }}-${{ matrix.spark-version }}/

  integration-test-oracle-21:
