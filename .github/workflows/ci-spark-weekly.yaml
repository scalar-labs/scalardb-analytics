          path: scalardb-analytics-spark/out/collectTestReports.dest/${{ matrix.scala-version }}-${{ matrix.spark-version }}/

  integration-test-oracle-19:
    needs: [build-gradle-dependencies, build-server-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala-version: ["2.12", "2.13"]
        spark-version: ["3.5", "4.0", "4.1"]
        # Spark 4 is published for Scala 2.13 only.
        exclude:
          - scala-version: "2.12"
            spark-version: "4.0"
          - scala-version: "2.12"
