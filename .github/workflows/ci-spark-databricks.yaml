name: CI for ScalarDB Analytics Spark (Databricks)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC

env:
  GPR_USERNAME: ${{ github.repository_owner }}
  GPR_PASSWORD: ${{ secrets.CR_PAT }}
  ANALYTICS_INT_TEST_ENV: CI
  ANALYTICS_INT_TEST_ENV_DATABRICKS_HOST: ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_HOST}}
  ANALYTICS_INT_TEST_ENV_DATABRICKS_HTTP_PATH: ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_HTTP_PATH}}
  ANALYTICS_INT_TEST_ENV_DATABRICKS_O_AUTH_CLIENT_ID: ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_O_AUTH_CLIENT_ID}}
  ANALYTICS_INT_TEST_ENV_DATABRICKS_O_AUTH_SECRET: ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_O_AUTH_SECRET}}

jobs:
  # Ideally, we would upload Gradle artifacts only when Gradle files change (via ci.yaml)
  # and reuse them here. However, GitHub Actions doesn't provide a straightforward way
  # to download artifacts from a different workflow run without knowing the run-id or
  # using third-party actions. As a workaround, we publish Gradle modules in every run.
  build-gradle-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Gradle modules to Maven Local
        working-directory: scalardb-analytics-core
        run: ./gradlew publishToMavenLocal

      - name: Upload Maven Local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/scalardb-analytics*
          retention-days: 1

  test:
    needs: build-gradle-dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala-version: ['2.12', '2.13']
        spark-version: ['3.4', '3.5']

    steps:
      # Catalog names cannot contain dots (.) as they conflict with SQL identifier separators.
      # GitHub Actions expressions don't have a replace function, so we use shell substitution.
      - name: Set catalog suffix
        run: |
          SCALA_VERSION=$(echo "${{ matrix.scala-version }}" | tr '.' '_')
          SPARK_VERSION=$(echo "${{ matrix.spark-version }}" | tr '.' '_')
          echo "ANALYTICS_INT_TEST_ENV_DATABRICKS_CATALOG_SUFFIX=${{ github.run_id }}_${{ github.run_attempt }}_${SCALA_VERSION}_${SPARK_VERSION}" >> $GITHUB_ENV

      - name: Verify Databricks credentials are not expired
        run: |
          # Install Databricks CLI
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

          # Configure Databricks CLI credentials with OAuth
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_HOST}}
          client_id = ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_O_AUTH_CLIENT_ID}}
          client_secret = ${{secrets.SCALAR_DB_ANALYTICS_CI_DATABRICKS_O_AUTH_SECRET}}
          EOF

          echo "Verifying Databricks credentials..."
          databricks catalogs list || (echo "Failed to authenticate with Databricks, credentials may be expired. To renew the credentials, refer to https://github.com/scalar-labs/scalardb-analytics/blob/main/.github/workflows/README.mdx#renew-databricks-and-snowflake-credentials-once-expired " && exit 1)
          echo "Databricks credentials are valid."

      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download Gradle modules
        uses: actions/download-artifact@v8
        with:
          name: gradle-maven-local
          path: ~/.m2/repository/com/scalar-labs/

      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('scalardb-analytics-spark/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Run Databricks integration tests
        working-directory: scalardb-analytics-spark
        run: |
          ./mill 'ciTest[${{ matrix.scala-version }},${{ matrix.spark-version }}].integrationTestDatabricks'

      - name: Collect Mill test reports
        if: always()
        working-directory: scalardb-analytics-spark
        run: ./mill collectTestReports

      - name: Upload Mill test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-spark-databricks-test-reports-${{ matrix.scala-version }}-${{ matrix.spark-version }}
          path: scalardb-analytics-spark/out/collectTestReports.dest/${{ matrix.scala-version }}-${{ matrix.spark-version }}/
