version: 2
updates:
  # For Docker, update the base images pinned in all Dockerfiles on the default branch only
  # The release branches are not covered here because base image updates are applied to them
  # by backporting the changes merged into the default branch
  # When a new Dockerfile is added, add its directory to the "directories" list below
  # Major version updates of the Java base image are ignored because upgrading the Java runtime
  # of the released images is a manual decision; the other image updates are grouped into a single PR
  # Dependabot only proposes tags that share the same suffix as the current one (for example "-jre-resolute"),
  # so moving to a new Ubuntu code name remains a manual change
  - package-ecosystem: "docker"
    groups:
      container images on branch main:
        patterns:
          - "*"
    directories:
      - "/scalardb-analytics-core/docker/cli"
      - "/scalardb-analytics-core/docker/server"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Asia/Tokyo"
