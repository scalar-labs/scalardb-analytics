version: 2
updates:
  # For Docker, update the base images pinned in all Dockerfiles on the default and release branches
  # Dependabot reads this file only on the default branch, so each release branch needs its own block here
  # When a release branch "release/X.Y" is created, copy the block below, add 'target-branch: "release/X.Y"' to it,
  # and rename its group to "container images on branch X.Y"; remove the block when the branch is no longer maintained
  # When a new Dockerfile is added, add its directory to the "directories" list of every block that covers it
  # Major version updates of the Java base image are ignored because upgrading the Java runtime
  # of the released images is a manual decision; the other image updates are grouped into a single PR
  # Dependabot only proposes tags that share the same suffix as the current one (for example "-jre-resolute"),
  # so moving to a new Ubuntu code name remains a manual change
  - package-ecosystem: "docker"
    groups:
      container images on branch main:
        patterns:
          - "*"
    directories:
      - "/scalardb-analytics-core/docker/cli"
      - "/scalardb-analytics-core/docker/server"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Asia/Tokyo"
