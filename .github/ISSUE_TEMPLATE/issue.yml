name: Issue
description: Propose a feature, an improvement, or other work
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why the work is needed.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when the work is done. A rough goal is fine.
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: What is still undecided. Leave it empty when nothing is.
    validations:
      required: false
