name: Bugfix
description: Report a bug
labels: ["bugfix"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide details about the environment where the bug occurred.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04]
        - Version: [e.g. 1.2.3]
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any additional context (logs, screenshots, etc.).
    validations:
      required: false
