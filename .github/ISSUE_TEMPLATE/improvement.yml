name: Improvement
description: Suggest a refactoring or internal improvement
labels: ["improvement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to improve?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this improvement needed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How do you think this should be done?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any additional context or references.
    validations:
      required: false
