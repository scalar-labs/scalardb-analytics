version = "3.8.3"
runner.dialect = scala213

maxColumn = 100
indent.main = 2
indent.significant = 2
assumeStandardLibraryStripMargin = true

align.preset = more
align.multiline = false

newlines.beforeCurlyLambdaParams = false
newlines.afterCurlyLambdaParams = keep

rewrite.rules = [SortImports, RedundantBraces, RedundantParens]
rewrite.redundantBraces.stringInterpolation = true

spaces.inImportCurlyBraces = false

binPack.literalArgumentLists = true
optIn.breakChainOnFirstMethodDot = false

danglingParentheses.preset = true
verticalMultiline.arityThreshold = 3

# Mill build definitions are Scala 3 sources, unlike the cross-built module sources above.
# They also need adding to the include paths, which default to .scala, .sbt and .sc only.
project.includePaths = ["glob:**.scala", "glob:**.sbt", "glob:**.sc", "glob:**.mill"]

fileOverride {
  "glob:**.mill" {
    runner.dialect = scala3
  }
}
