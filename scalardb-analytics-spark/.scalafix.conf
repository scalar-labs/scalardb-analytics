rules = [
  DisableSyntax
  LeakingImplicitClassVal
  NoAutoTupling
  NoValInForComprehension
  OrganizeImports
  RemoveUnused
]

RemoveUnused {
  imports = true
  privates = true
  locals = true
  patternvars = true
  params = false
}

OrganizeImports {
  groupedImports = Merge
  removeUnused = true
}

# Only enable DisableSyntax rules that WartRemover doesn't handle
DisableSyntax {
  noVars = false
  noNulls = false
  noReturns = true      # WartRemover handles this but Scalafix can provide better error messages
  noAsInstanceOf = false
  noIsInstanceOf = false
  noXml = true
  noDefaultArgs = false
  noFinalVal = false
  noFinalize = true
  noValPatterns = false
}
